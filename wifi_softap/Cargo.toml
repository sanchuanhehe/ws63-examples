[package]
name = "wifi_softap"
version = "0.1.0"
edition = "2024"
description = "WS63 two-board HIL SoftAP fixture"
license = "MIT"

[features]
default = ["wpa2"]
wpa2 = ["hisi-rf/profile-wifi-wpa2-softap"]
wpa3 = ["hisi-rf/profile-wifi-wpa3-softap"]
data-path-diagnostics = ["hisi-rf/ws63-data-path-diagnostics"]

[dependencies]
hisi-hal = { version = "0.7.0-alpha.9", features = ["chip-ws63", "unstable"] }
hisi-panic-handler = { version = "0.1.0", default-features = false, features = ["panic-uart0"] }
hisi-rf = { version = "=0.1.0-alpha.96", features = ["chip-ws63"] }
hisi-riscv-rt = { version = "0.5.10", default-features = false, features = [
    "chip-ws63",
    "bundled-memory-x",
    "boot-header",
    "ws63-bgle-32k",
    "ws63-radio-main-stack-32k",
] }
hisi-rtos = { version = "=0.1.0-alpha.24", features = ["chip-ws63"] }
smoltcp = { version = "0.13", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-udp",
] }

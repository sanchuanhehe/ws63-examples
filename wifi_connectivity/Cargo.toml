[package]
name = "wifi_connectivity"
version = "0.1.0"
edition = "2024"
description = "WS63 end-to-end Wi-Fi connectivity through the public hisi-rf facade"
license = "MIT"

[features]
default = ["wpa2"]
wpa2 = ["hisi-rf/profile-wifi-wpa2-smoltcp"]
wpa3 = ["hisi-rf/profile-wifi-wpa3-smoltcp"]
data-path-diagnostics = ["hisi-rf/ws63-data-path-diagnostics"]
diagnostic-disable-sta-pm = [
    "data-path-diagnostics",
    "hisi-rf/ws63-station-pm-diagnostics",
]
dual-board-hil = []

[dependencies]
embassy-executor = { version = "0.10", features = ["platform-riscv32", "executor-thread"] }
embassy-time = { version = "0.5", default-features = false }
hisi-hal = { version = "0.7.0-alpha.9", features = ["chip-ws63", "unstable"] }
hisi-panic-handler = { version = "0.1.0", default-features = false, features = ["panic-uart0"] }
hisi-rf = { version = "=0.1.0-alpha.102", features = ["chip-ws63"] }
hisi-riscv-rt = { version = "0.5.10", default-features = false, features = [
    "chip-ws63",
    "bundled-memory-x",
    "boot-header",
    "ws63-bgle-32k",
    "ws63-radio-main-stack-32k",
] }
hisi-rtos = { version = "=0.1.0-alpha.25", features = ["chip-ws63", "embassy"] }
smoltcp = { version = "0.13", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-dhcpv4",
    "socket-udp",
] }
static_cell = "2"
